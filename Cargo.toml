[package]
name = "audio_2_dmx"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
cpal = "0.16.0"
rustfft = "6.4.1"
realfft = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.2"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
anyhow = "1.0.100"

